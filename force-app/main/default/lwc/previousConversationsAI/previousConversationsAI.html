<template>
  <article class="pc-shell">
    <div if:true={showPicker} class="pc-picker">
      <lightning-record-picker
        label="Case"
        placeholder="Search cases…"
        object-api-name="Opportunity"
        onchange={handlePick}
      ></lightning-record-picker>
    </div>

    <p if:true={needsCase} class="pc-quiet">Pick a case to see everything that has been said on it.</p>

    <div if:true={loading} class="pc-loading">
      <lightning-spinner alternative-text="Loading conversations" size="small"></lightning-spinner>
    </div>

    <p if:true={error} class="pc-error" role="alert">{error}</p>

    <template if:true={hasCase}>
      <!-- ── AI Summary hero ── -->
      <section class="pc-hero" aria-labelledby="pc-ai-title">
        <div class="pc-hero-head">
          <span class="pc-hero-icon" aria-hidden="true">
            <lightning-icon icon-name="utility:einstein" size="small" variant="inverse" alternative-text=""></lightning-icon>
          </span>
          <div class="pc-hero-title">
            <h3 id="pc-ai-title" class="pc-ai-title">AI Summary</h3>
            <p class="pc-ai-sub">Complete overview from calls, emails and notes</p>
          </div>
          <div class="pc-hero-meta">
            <span if:true={lastUpdated} class="pc-updated">{lastUpdated}</span>
            <span class="pc-ai-badge">AI-generated</span>
            <button
              type="button"
              class="pc-btn pc-btn-primary"
              disabled={askDisabled}
              onclick={handleGenerate}
            >
              {generateLabel}
            </button>
          </div>
        </div>

        <p if:true={agentUnset} class="pc-quiet">The AI Summary is not available in this org yet.</p>

        <p if:true={isEmpty} class="pc-quiet">Nothing has been recorded on this case yet, so there is nothing to summarise.</p>

        <div if:true={showSummaryPrompt} class="pc-hero-empty">
          The AI Summary builds itself when the case opens. Press <b>Regenerate</b> any time for a fresh one.
        </div>

        <div if:true={askingSummary} class="pc-loading">
          <lightning-spinner alternative-text="Generating the AI Summary" size="small"></lightning-spinner>
        </div>

        <p if:true={agentError} class="pc-error" role="alert" aria-live="assertive">{agentError}</p>
        <p if:true={agentNotice} class="pc-notice" aria-live="polite">{agentNotice}</p>

        <!-- Overall Summary + Customer Sentiment -->
        <div if:true={hasSummary} class="pc-hero-grid">
          <div class="pc-box pc-overall">
            <span class="pc-box-icon pc-tone-violet" aria-hidden="true">
              <lightning-icon icon-name="utility:summary" size="x-small" alternative-text=""></lightning-icon>
            </span>
            <div>
              <h4 class="pc-box-title">Overall Summary</h4>
              <p class="pc-overall-text">{overallSummary}</p>
            </div>
          </div>
          <div class="pc-box pc-sentiment">
            <span class={sentimentIconClass} aria-hidden="true">
              <lightning-icon icon-name={sentimentIcon} size="small" alternative-text=""></lightning-icon>
            </span>
            <div>
              <span class="pc-small-label">Customer Sentiment</span>
              <span class={sentimentLabelClass}>{sentimentLabel}</span>
              <p if:true={sentimentNote} class="pc-muted">{sentimentNote}</p>
            </div>
          </div>
        </div>

        <div if:true={hasSummaryText} class="pc-box pc-overall">
          <span class="pc-box-icon pc-tone-violet" aria-hidden="true">
            <lightning-icon icon-name="utility:summary" size="x-small" alternative-text=""></lightning-icon>
          </span>
          <div>
            <h4 class="pc-box-title">Overall Summary</h4>
            <p class="pc-overall-text">{summaryText}</p>
          </div>
        </div>
      </section>

      <!-- ── Counts + next key meeting ── -->
      <section class="pc-stats" aria-label="Conversation counts">
        <div class="pc-stat">
          <span class="pc-round-icon pc-tone-green" aria-hidden="true">
            <lightning-icon icon-name="utility:call" size="small" alternative-text=""></lightning-icon>
          </span>
          <div>
            <span class="pc-stat-num">{stats.calls}</span>
            <span class="pc-stat-label">Calls</span>
          </div>
        </div>
        <div class="pc-stat">
          <span class="pc-round-icon pc-tone-blue" aria-hidden="true">
            <lightning-icon icon-name="utility:email" size="small" alternative-text=""></lightning-icon>
          </span>
          <div>
            <span class="pc-stat-num">{stats.emails}</span>
            <span class="pc-stat-label">Emails</span>
            <span class="pc-muted">Sent and received</span>
          </div>
        </div>
        <div class="pc-stat">
          <span class="pc-round-icon pc-tone-violet" aria-hidden="true">
            <lightning-icon icon-name="utility:note" size="small" alternative-text=""></lightning-icon>
          </span>
          <div>
            <span class="pc-stat-num">{stats.notes}</span>
            <span class="pc-stat-label">Notes</span>
            <span class="pc-muted">Internal notes on this client</span>
          </div>
        </div>
        <div class="pc-stat pc-meeting">
          <span class="pc-round-icon pc-tone-red" aria-hidden="true">
            <lightning-icon icon-name="utility:event" size="small" alternative-text=""></lightning-icon>
          </span>
          <div>
            <span class="pc-small-label">Next Key Meeting</span>
            <template if:true={hasMeeting}>
              <span class="pc-meeting-title">{meeting.title}</span>
              <span class="pc-muted">{meeting.when}</span>
            </template>
            <span if:false={hasMeeting} class="pc-muted">Shows here after the AI Summary finds one.</span>
          </div>
        </div>
      </section>

      <!-- ── Insights, concerns, next actions ── -->
      <section if:true={hasSummary} class="pc-columns">
        <div class="pc-col pc-col-green">
          <h4 class="pc-col-title">
            <lightning-icon icon-name="utility:check" size="x-small" alternative-text=""></lightning-icon>
            Key Insights
          </h4>
          <ul if:true={hasKeyInsights} class="pc-bullets">
            <template for:each={keyInsights} for:item="k">
              <li key={k.id}><span class="pc-dot pc-tone-green" aria-hidden="true"></span>{k.text}</li>
            </template>
          </ul>
          <p if:false={hasKeyInsights} class="pc-muted">None found.</p>
        </div>

        <div class="pc-col pc-col-red">
          <h4 class="pc-col-title pc-text-red">
            <lightning-icon icon-name="utility:warning" size="x-small" alternative-text=""></lightning-icon>
            Customer Concerns
          </h4>
          <ul if:true={hasCustomerConcerns} class="pc-bullets">
            <template for:each={customerConcerns} for:item="c">
              <li key={c.id}><span class="pc-dot pc-tone-amber" aria-hidden="true"></span>{c.text}</li>
            </template>
          </ul>
          <p if:false={hasCustomerConcerns} class="pc-muted">No concerns found.</p>
        </div>

        <div class="pc-col pc-col-blue">
          <h4 class="pc-col-title pc-text-blue">
            <lightning-icon icon-name="utility:target" size="x-small" alternative-text=""></lightning-icon>
            Recommended Next Actions
          </h4>
          <ul if:true={hasNextActions} class="pc-actions">
            <template for:each={nextActions} for:item="a">
              <li key={a.id}>
                <span class="pc-action-text">{a.action}</span>
                <span if:true={a.hasPriority} class={a.priorityClass}>{a.priority}</span>
                <span if:true={a.hasDue} class="pc-due">{a.due}</span>
              </li>
            </template>
          </ul>
          <p if:false={hasNextActions} class="pc-muted">No next actions suggested.</p>
        </div>
      </section>

      <p if:true={notice} class="pc-notice">{notice}</p>

    </template>
  </article>
</template>
